name: CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Incrementar versión en README
        run: |
          FECHA=$(date +'%Y-%m-%d %H:%M:%S')
          sed -i 's/AppVersion-0/AppVersion-1 ('"$FECHA"')/g' README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: bump version in README" || echo "No changes to commit"
          git push

  validate-prod:
    needs: update-readme
    runs-on: self-hosted
    steps:
      - name: Validar PROD_TOKEN
        shell: powershell
        run: |
          if ("${{ secrets.PROD_TOKEN }}" -eq "12345") {
            Write-Host "PROD_TOKEN correcto"
            exit 0
          } else {
            Write-Host "PROD_TOKEN incorrecto"
            exit 1
          }
