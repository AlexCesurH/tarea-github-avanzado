name: CI Pipeline

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Añadir feature al README
        run: |
          echo "Añadida feature: ${{ github.head_ref || github.ref_name }}" >> README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update README with feature" || echo "No changes to commit"
          git push

  validate-dev:
    needs: update-readme
    runs-on: self-hosted
    steps:
      - name: Validar DEV_TOKEN
        shell: pwsh
        run: |
          if ("${{ secrets.DEV_TOKEN }}" -eq "12345") {
            Write-Host "DEV_TOKEN correcto"
            exit 0
          } else {
            Write-Host "DEV_TOKEN incorrecto"
            exit 1
          }
